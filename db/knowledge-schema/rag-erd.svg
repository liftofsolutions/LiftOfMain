<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1020" viewBox="0 0 860 1020" role="img" aria-label="Knowledge (RAG) schema diagram">
        <title>Knowledge (RAG) schema diagram</title>
        <desc>A project has many rags, each optionally for one country and stored in its own namespace of a Pinecone index. Each rag has documents with their link and metadata. Long processing runs as rag_jobs, temporary documents that point to the rag and the document and expire after they finish.</desc>
