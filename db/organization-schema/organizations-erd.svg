<svg xmlns="http://www.w3.org/2000/svg" width="860" height="740" viewBox="0 0 860 740" role="img" aria-labelledby="er-title er-desc">
        <title id="er-title">organizations entity relationship diagram</title>
        <desc id="er-desc">A user, referenced from the User schema, has zero or one membership pointing to one organization. An organization points to one plan from the Billing schema, has one or more members, zero or more invitations, and an optional embedded settings object.</desc>
        <style>
.er-box { fill: #FFFFFF; stroke: #B9C2CC; stroke-width: 1; }
.er-box-ref { fill: #FFFFFF; stroke: #5A6474; stroke-width: 1; stroke-dasharray: 5 4; }
.er-head-main { fill: #0B6B6B; }
.er-head { fill: #E2EFEE; }
.er-head-ref { fill: #EDF0F3; }
.er-sep { stroke: #E1E6EB; stroke-width: 1; }
.er-linkrow { fill: #E2EFEE; }
.er-title-main { font-family: "Instrument Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
.er-tag-main { font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, "DejaVu Sans", sans-serif; font-size: 12px; fill: #FFFFFF; opacity: 0.85; }
.er-title { font-family: "Instrument Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 600; fill: #17202A; }
.er-tag { font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, "DejaVu Sans", sans-serif; font-size: 12px; fill: #5A6474; }
.er-f { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #17202A; }
.er-f.link { fill: #0B6B6B; font-weight: 500; }
.er-ty { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #5A6474; }
.er-pk { fill: #0B6B6B; font-weight: 500; }
.er-line { stroke: #0B6B6B; stroke-width: 1.5; fill: none; }
.er-zero { fill: #FFFFFF; stroke: #0B6B6B; stroke-width: 1.5; }
.er-card { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 500; fill: #0B6B6B; }
        </style>
        <rect width="860" height="740" fill="#FFFFFF"/>

        <!-- users (reference) -->
        <rect class="er-box-ref" x="24" y="24" width="300" height="96" rx="8"/>
        <path class="er-linkrow" d="M25 92 H323 V112 Q323 119 316 119 H32 Q25 119 25 112 Z"/>
        <path class="er-head-ref" d="M24.5 32 Q24.5 24.5 32 24.5 H316 Q323.5 24.5 323.5 32 V64 H24.5 Z"/>
        <text class="er-title" x="38" y="49">users</text>
        <text class="er-tag" x="310" y="49" text-anchor="end">from User schema</text>
        <line class="er-sep" x1="24" y1="64" x2="324" y2="64"/>
        <line class="er-sep" x1="24" y1="92" x2="324" y2="92"/>
        <text class="er-f" x="38" y="82">_id</text><text class="er-ty" x="310" y="82" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>
        <text class="er-f link" x="38" y="110">membership?</text><text class="er-ty" x="310" y="110" text-anchor="end">object</text>

        <!-- membership (embedded in users) -->
        <rect class="er-box" x="24" y="168" width="300" height="152" rx="8"/>
        <rect class="er-linkrow" x="25" y="208" width="298" height="28"/>
        <path class="er-head" d="M24.5 176 Q24.5 168.5 32 168.5 H316 Q323.5 168.5 323.5 176 V208 H24.5 Z"/>
        <text class="er-title" x="38" y="193">membership</text>
        <text class="er-tag" x="310" y="193" text-anchor="end">in users, optional</text>
        <line class="er-sep" x1="24" y1="208" x2="324" y2="208"/>
        <line class="er-sep" x1="24" y1="236" x2="324" y2="236"/>
        <line class="er-sep" x1="24" y1="264" x2="324" y2="264"/>
        <line class="er-sep" x1="24" y1="292" x2="324" y2="292"/>
        <text class="er-f link" x="38" y="226">org_id</text><text class="er-ty" x="310" y="226" text-anchor="end">uuid FK</text>
        <text class="er-f" x="38" y="254">role</text><text class="er-ty" x="310" y="254" text-anchor="end">owner | admin | member</text>
        <text class="er-f" x="38" y="282">created_at</text><text class="er-ty" x="310" y="282" text-anchor="end">date</text>
        <text class="er-f" x="38" y="310">updated_at</text><text class="er-ty" x="310" y="310" text-anchor="end">date</text>

        <!-- invitations (collection) -->
        <rect class="er-box" x="24" y="368" width="300" height="320" rx="8"/>
        <rect class="er-linkrow" x="25" y="436" width="298" height="28"/>
        <path class="er-head-main" d="M24 376 Q24 368 32 368 H316 Q324 368 324 376 V408 H24 Z"/>
        <text class="er-title-main" x="38" y="393">invitations</text>
        <text class="er-tag-main" x="310" y="393" text-anchor="end">collection</text>
        <line class="er-sep" x1="24" y1="436" x2="324" y2="436"/>
        <line class="er-sep" x1="24" y1="464" x2="324" y2="464"/>
        <line class="er-sep" x1="24" y1="492" x2="324" y2="492"/>
        <line class="er-sep" x1="24" y1="520" x2="324" y2="520"/>
        <line class="er-sep" x1="24" y1="548" x2="324" y2="548"/>
        <line class="er-sep" x1="24" y1="576" x2="324" y2="576"/>
        <line class="er-sep" x1="24" y1="604" x2="324" y2="604"/>
        <line class="er-sep" x1="24" y1="632" x2="324" y2="632"/>
        <line class="er-sep" x1="24" y1="660" x2="324" y2="660"/>
        <text class="er-f" x="38" y="426">_id</text><text class="er-ty" x="310" y="426" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>
        <text class="er-f link" x="38" y="454">org_id</text><text class="er-ty" x="310" y="454" text-anchor="end">uuid FK</text>
        <text class="er-f" x="38" y="482">email</text><text class="er-ty" x="310" y="482" text-anchor="end">string</text>
        <text class="er-f" x="38" y="510">role</text><text class="er-ty" x="310" y="510" text-anchor="end">owner | admin | member</text>
        <text class="er-f" x="38" y="538">token_hash</text><text class="er-ty" x="310" y="538" text-anchor="end">string <tspan class="er-pk">UK</tspan></text>
        <text class="er-f" x="38" y="566">invited_by</text><text class="er-ty" x="310" y="566" text-anchor="end">uuid FK → users</text>
        <text class="er-f" x="38" y="594">status</text><text class="er-ty" x="310" y="594" text-anchor="end">enum</text>
        <text class="er-f" x="38" y="622">expires_at</text><text class="er-ty" x="310" y="622" text-anchor="end">date</text>
        <text class="er-f" x="38" y="650">created_at</text><text class="er-ty" x="310" y="650" text-anchor="end">date</text>
        <text class="er-f" x="38" y="678">updated_at</text><text class="er-ty" x="310" y="678" text-anchor="end">date</text>

        <!-- plans (reference) -->
        <rect class="er-box-ref" x="536" y="24" width="300" height="68" rx="8"/>
        <path class="er-head-ref" d="M536.5 32 Q536.5 24.5 544 24.5 H828 Q835.5 24.5 835.5 32 V64 H536.5 Z"/>
        <text class="er-title" x="550" y="49">plans</text>
        <text class="er-tag" x="822" y="49" text-anchor="end">from Billing schema</text>
        <line class="er-sep" x1="536" y1="64" x2="836" y2="64"/>
        <text class="er-f" x="550" y="82">_id</text><text class="er-ty" x="822" y="82" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>

        <!-- organizations (collection) -->
        <rect class="er-box" x="536" y="140" width="300" height="348" rx="8"/>
        <rect class="er-linkrow" x="537" y="292" width="298" height="28"/>
        <path class="er-linkrow" d="M537 460 H835 V480 Q835 487 828 487 H544 Q537 487 537 480 Z"/>
        <path class="er-head-main" d="M536 148 Q536 140 544 140 H828 Q836 140 836 148 V180 H536 Z"/>
        <text class="er-title-main" x="550" y="165">organizations</text>
        <text class="er-tag-main" x="822" y="165" text-anchor="end">collection</text>
        <line class="er-sep" x1="536" y1="208" x2="836" y2="208"/>
        <line class="er-sep" x1="536" y1="236" x2="836" y2="236"/>
        <line class="er-sep" x1="536" y1="264" x2="836" y2="264"/>
        <line class="er-sep" x1="536" y1="292" x2="836" y2="292"/>
        <line class="er-sep" x1="536" y1="320" x2="836" y2="320"/>
        <line class="er-sep" x1="536" y1="348" x2="836" y2="348"/>
        <line class="er-sep" x1="536" y1="376" x2="836" y2="376"/>
        <line class="er-sep" x1="536" y1="404" x2="836" y2="404"/>
        <line class="er-sep" x1="536" y1="432" x2="836" y2="432"/>
        <line class="er-sep" x1="536" y1="460" x2="836" y2="460"/>
        <text class="er-f" x="550" y="198">_id</text><text class="er-ty" x="822" y="198" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>
        <text class="er-f" x="550" y="226">name</text><text class="er-ty" x="822" y="226" text-anchor="end">string</text>
        <text class="er-f" x="550" y="254">slug</text><text class="er-ty" x="822" y="254" text-anchor="end">string <tspan class="er-pk">UK</tspan></text>
        <text class="er-f" x="550" y="282">logo_url?</text><text class="er-ty" x="822" y="282" text-anchor="end">string</text>
        <text class="er-f link" x="550" y="310">plan_id</text><text class="er-ty" x="822" y="310" text-anchor="end">uuid FK → plans</text>
        <text class="er-f" x="550" y="338">status</text><text class="er-ty" x="822" y="338" text-anchor="end">active | suspended | deleted</text>
        <text class="er-f" x="550" y="366">created_by</text><text class="er-ty" x="822" y="366" text-anchor="end">uuid FK → users</text>
        <text class="er-f" x="550" y="394">created_at</text><text class="er-ty" x="822" y="394" text-anchor="end">date</text>
        <text class="er-f" x="550" y="422">updated_at</text><text class="er-ty" x="822" y="422" text-anchor="end">date</text>
        <text class="er-f" x="550" y="450">deleted_at?</text><text class="er-ty" x="822" y="450" text-anchor="end">date</text>
        <text class="er-f link" x="550" y="478">settings?</text><text class="er-ty" x="822" y="478" text-anchor="end">object</text>

        <!-- settings (embedded in organizations) -->
        <rect class="er-box" x="536" y="536" width="300" height="180" rx="8"/>
        <path class="er-head" d="M536.5 544 Q536.5 536.5 544 536.5 H828 Q835.5 536.5 835.5 544 V576 H536.5 Z"/>
        <text class="er-title" x="550" y="561">settings</text>
        <text class="er-tag" x="822" y="561" text-anchor="end">embedded, optional</text>
        <line class="er-sep" x1="536" y1="576" x2="836" y2="576"/>
        <line class="er-sep" x1="536" y1="604" x2="836" y2="604"/>
        <line class="er-sep" x1="536" y1="632" x2="836" y2="632"/>
        <line class="er-sep" x1="536" y1="660" x2="836" y2="660"/>
        <line class="er-sep" x1="536" y1="688" x2="836" y2="688"/>
        <text class="er-f" x="550" y="594">default_role</text><text class="er-ty" x="822" y="594" text-anchor="end">admin | member</text>
        <text class="er-f" x="550" y="622">invite_only</text><text class="er-ty" x="822" y="622" text-anchor="end">bool</text>
        <text class="er-f" x="550" y="650">allowed_providers</text><text class="er-ty" x="822" y="650" text-anchor="end">provider[]</text>
        <text class="er-f" x="550" y="678">created_at</text><text class="er-ty" x="822" y="678" text-anchor="end">date</text>
        <text class="er-f" x="550" y="706">updated_at</text><text class="er-ty" x="822" y="706" text-anchor="end">date</text>

        <!-- users to membership: one to zero-or-one -->
        <line class="er-line" x1="174" y1="120" x2="174" y2="168"/>
        <line class="er-line" x1="168" y1="128" x2="180" y2="128"/>
        <line class="er-line" x1="168" y1="134" x2="180" y2="134"/>
        <circle class="er-zero" cx="174" cy="148" r="4.5"/>
        <line class="er-line" x1="167" y1="159" x2="181" y2="159"/>
        <text class="er-card" x="188" y="152">1 : 0..1</text>

        <!-- organizations to membership: one to one-or-more -->
        <path class="er-line" d="M324 222 H400 V194 H536"/>
        <line class="er-line" x1="522" y1="187" x2="522" y2="201"/>
        <line class="er-line" x1="528" y1="187" x2="528" y2="201"/>
        <path class="er-line" d="M338 222 L324 214 M338 222 L324 230"/>
        <line class="er-line" x1="344" y1="215" x2="344" y2="229"/>
        <text class="er-card" x="468" y="185" text-anchor="middle">1 : N</text>

        <!-- organizations to invitations: one to zero-or-more -->
        <path class="er-line" d="M324 450 H440 V250 H536"/>
        <line class="er-line" x1="522" y1="243" x2="522" y2="257"/>
        <line class="er-line" x1="528" y1="243" x2="528" y2="257"/>
        <path class="er-line" d="M338 450 L324 442 M338 450 L324 458"/>
        <circle class="er-zero" cx="347" cy="450" r="4.5"/>
        <text class="er-card" x="488" y="241" text-anchor="middle">1 : 0..N</text>

        <!-- plans to organizations: one to zero-or-more -->
        <line class="er-line" x1="686" y1="92" x2="686" y2="140"/>
        <line class="er-line" x1="680" y1="100" x2="692" y2="100"/>
        <line class="er-line" x1="680" y1="106" x2="692" y2="106"/>
        <circle class="er-zero" cx="686" cy="119" r="4.5"/>
        <path class="er-line" d="M686 128 L678 140 M686 128 L694 140"/>
        <text class="er-card" x="700" y="123">1 : 0..N</text>

        <!-- organizations to settings: one to zero-or-one -->
        <line class="er-line" x1="686" y1="488" x2="686" y2="536"/>
        <line class="er-line" x1="680" y1="496" x2="692" y2="496"/>
        <line class="er-line" x1="680" y1="502" x2="692" y2="502"/>
        <circle class="er-zero" cx="686" cy="517" r="4.5"/>
        <line class="er-line" x1="679" y1="528" x2="693" y2="528"/>
        <text class="er-card" x="700" y="521">1 : 0..1</text>
      </svg>
