[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hitesh-Kumar-2001", email = "hiteshhkjapan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-cloud-firestore>=2.30.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.3",
    "langchain-deepseek>=1.1.0",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.3",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "pinecone>=10.0.0",
    "psutil>=7.2.2",
    "pymongo>=4.18.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rarfile>=4.5",
    "redis>=8.1.0",
    "tiktoken>=0.14.0",
]

[tool.uv]
# Application, not a distributable package: `src` is the import root.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Btest = component/logic tests, Ptest = product tests that drive the routes.
pythonpath = ["src"]
testpaths = ["Btest", "Ptest"]
python_files = ["*Test.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
